name: Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/scanhemat:${{ github.sha }}
  MIGRATION_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/scanhemat-migrations:${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scanhemat_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
      OCR_PROVIDER: google-document-ai
      GOOGLE_CLOUD_PROJECT_ID: ci-placeholder
      GOOGLE_CLOUD_LOCATION: us
      GOOGLE_DOCUMENT_AI_PROCESSOR_ID: ci-placeholder
      AI_GENERATION_PROVIDER: gemini-api
      GEMINI_API_KEY: ci-placeholder
      GEMINI_RECEIPT_MODEL: gemini-3.5-flash
      GEMINI_ASSISTANT_MODEL: gemini-3.5-flash
      GEMINI_VISION_MODEL: gemini-3.5-flash
      GEMINI_FALLBACK_MODEL: gemini-2.5-flash
      RECEIPT_EXTRACTION_STRATEGY: hybrid
      RECEIPT_STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run ci

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - run: docker build --target runner --tag "$IMAGE" .
      - run: docker build --target migration-runner --tag "$MIGRATION_IMAGE" .
      - run: docker push "$IMAGE"
      - run: docker push "$MIGRATION_IMAGE"
      - name: Deploy migration job
        run: |
          gcloud run jobs deploy "${{ vars.CLOUD_RUN_SERVICE }}-migrate" \
            --image "$MIGRATION_IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-secrets "DATABASE_URL=scanhemat-database-url:latest" \
            --quiet
      - name: Run migrations
        run: |
          gcloud run jobs execute "${{ vars.CLOUD_RUN_SERVICE }}-migrate" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait \
            --quiet
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --allow-unauthenticated \
            --set-env-vars "APP_VERSION=${{ github.sha }},NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }},MAX_RECEIPT_UPLOAD_MB=8,OCR_PROVIDER=google-document-ai,GOOGLE_CLOUD_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=${{ vars.GOOGLE_CLOUD_LOCATION }},GOOGLE_DOCUMENT_AI_PROCESSOR_ID=${{ vars.GOOGLE_DOCUMENT_AI_PROCESSOR_ID }},AI_GENERATION_PROVIDER=gemini-api,GEMINI_RECEIPT_MODEL=gemini-3.5-flash,GEMINI_ASSISTANT_MODEL=gemini-3.5-flash,GEMINI_VISION_MODEL=gemini-3.5-flash,GEMINI_FALLBACK_MODEL=gemini-2.5-flash,RECEIPT_EXTRACTION_STRATEGY=hybrid,RECEIPT_STORAGE_PROVIDER=gcs,GCS_RECEIPT_BUCKET=${{ vars.GCS_RECEIPT_BUCKET }}" \
            --set-secrets "DATABASE_URL=scanhemat-database-url:latest,NEXTAUTH_SECRET=scanhemat-nextauth-secret:latest,GEMINI_API_KEY=scanhemat-gemini-api-key:latest" \
            --quiet
