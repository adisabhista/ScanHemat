name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scanhemat_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
      OCR_PROVIDER: google-document-ai
      GOOGLE_CLOUD_PROJECT_ID: ci-placeholder
      GOOGLE_CLOUD_LOCATION: us
      GOOGLE_DOCUMENT_AI_PROCESSOR_ID: ci-placeholder
      AI_GENERATION_PROVIDER: gemini-api
      GEMINI_API_KEY: ci-placeholder
      GEMINI_RECEIPT_MODEL: gemini-3.5-flash
      GEMINI_ASSISTANT_MODEL: gemini-3.5-flash
      GEMINI_VISION_MODEL: gemini-3.5-flash
      GEMINI_FALLBACK_MODEL: gemini-2.5-flash
      RECEIPT_EXTRACTION_STRATEGY: hybrid
      RECEIPT_STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
